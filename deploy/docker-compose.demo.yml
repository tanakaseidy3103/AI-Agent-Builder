# Backend machine of the PUBLIC DEMO (see docs/DEPLOY.md). Runs only the stateful services; the demo API itself runs
# on the host under systemd (deploy/aab-demo.service) because each validation starts a sandbox container with the
# host's `docker` CLI. Nothing here is published to the internet: Postgres listens on 127.0.0.1 only.
#
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/demo.env up -d
#   docker compose -f deploy/docker-compose.demo.yml --env-file deploy/demo.env --profile local-model up -d   # + Ollama here
#
# deploy/demo.env (never committed): POSTGRES_PASSWORD=<strong random value>
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/demo.env}
      POSTGRES_DB: aab_demo            # the demo refuses databases whose name does not contain "demo"
    ports: ["127.0.0.1:5434:5432"]     # host only; the API connects from the host
    volumes: [demo-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aab -d aab_demo"]
      interval: 10s
      retries: 10

  # Optional: the model on the same machine (needs ~6 GB RAM free for qwen2.5-coder 7B, more is better).
  # For a separate model machine, leave this profile off and set OLLAMA_BASE_URL (+ OLLAMA_API_KEY) instead.
  ollama:
    profiles: ["local-model"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]   # never public: Ollama has no authentication
    environment:
      OLLAMA_KEEP_ALIVE: 5m            # unload the model when idle; the web process never holds it
      OLLAMA_NUM_PARALLEL: "1"         # the demo runs one generation at a time anyway
    volumes: [demo-ollama:/root/.ollama]

volumes:
  demo-pgdata:
  demo-ollama:
