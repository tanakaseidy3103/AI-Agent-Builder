services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-aab}
    # host 5433: avoids clashing with a locally installed PostgreSQL on 5432
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  # Containerized API: Studio + /v1 work, but sandboxed validation/execution reports "unavailable"
  # (no Docker socket is mounted on purpose). Run the API on the host for the full pipeline.
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aab}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-aab}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      STORAGE_DIR: /data
      STUDIO_LOCAL_ONLY: "false"  # requests arrive via the Docker bridge; the port below is loopback-only
    ports: ["127.0.0.1:8000:8000"]
    volumes: [skilldata:/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
  skilldata:
